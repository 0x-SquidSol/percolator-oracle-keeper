# Keeper CI (audit AUD-T3-1, 2026-10-18): typecheck + the whole node:test suite on every PR into and push to the v2.2
# keeper line. Self-contained: no secrets, no RPC (the suite runs on fixtures and fakes). It does NOT deploy anything,
# and it is deliberately not wired to relaunch-live (Railway auto-deploys that branch).
name: keeper-ci

on:
  push:
    branches: [feat/v22-keeper-growth]
  pull_request:
    branches: [feat/v22-keeper-growth]

permissions:
  contents: read

concurrency:
  group: keeper-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: shell syntax
        # deploy/railway-start.sh is the container's CMD: a parse error there fails every Railway boot, and nothing else runs it.
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25.6.1 # same as the Dockerfile / launchd keeper
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc
        run: pnpm exec tsc --noEmit
      - name: test
        env:
          TSX_DISABLE_CACHE: "1"
        run: pnpm test
